spring:
  application:
    name: iso8583-authorizer
  threads:
    virtual:
      enabled: true
  main:
    # The ISO 8583 server runs on virtual threads, which are always daemon threads: without this
    # the JVM would exit right after startup, since there is no web server keeping it alive.
    keep-alive: true

authorizer:
  iso:
    port: 8583
  # Key for tokenizing PANs (HMAC-SHA256), hex. DEVELOPMENT VALUE ONLY: a real issuer keeps it in an HSM or secrets manager.
  pan-token-key: 646576706b2d646576706b2d646576706b2d646576706b2d646576706b2d6465
  emv:
    # Issuer master key for application cryptograms (IMK-AC), 16 bytes hex. TEST KEY ONLY: a real
    # issuer keeps it in an HSM and never exposes it to the application.
    imk-ac: 0123456789ABCDEFFEDCBA9876543210
