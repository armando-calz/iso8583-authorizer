spring:
  application:
    name: iso8583-authorizer
  threads:
    virtual:
      enabled: true
  main:
    # The ISO 8583 server runs on virtual threads, which are always daemon threads; keep the JVM
    # alive even if no other non-daemon thread is running.
    keep-alive: true

# HTTP is only for operations: health and metrics. Authorizations go over ISO 8583 on authorizer.iso.port.
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        iso8583.messages: true

authorizer:
  iso:
    port: 8583
  # Key for tokenizing PANs (HMAC-SHA256), hex. DEVELOPMENT VALUE ONLY: a real issuer keeps it in an HSM or secrets manager.
  pan-token-key: 646576706b2d646576706b2d646576706b2d646576706b2d646576706b2d6465
  emv:
    # Issuer master key for application cryptograms (IMK-AC), 16 bytes hex. TEST KEY ONLY: a real
    # issuer keeps it in an HSM and never exposes it to the application.
    imk-ac: 0123456789ABCDEFFEDCBA9876543210
