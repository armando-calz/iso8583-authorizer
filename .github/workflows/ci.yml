name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Start PostgreSQL and the host
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Run the terminal demo end to end
        run: docker compose run --rm terminal demo

      - name: Host logs
        if: failure()
        run: docker compose logs host

      - name: Tear down
        if: always()
        run: docker compose down --volumes
